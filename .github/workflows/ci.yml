name: CI

on:
  push:
  pull_request:

jobs:
  secret-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no Anthropic keys are committed (guide §4.3 / acceptance §9.15)
        run: bash scripts/secret-sweep.sh

  proxy-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run proxy unit tests
        run: npm test
